name: AEM CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build, Test & Package All Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Cache Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Maven Clean Install (Build All Modules)
        run: mvn clean install --batch-mode --update-snapshots

      - name: Upload AEM Packages (ZIPs & JARs)
        uses: actions/upload-artifact@v4
        with:
          name: aem-packages
          path: |
            **/target/*.zip
            **/target/*.jar
          retention-days: 1

      - name: Upload Test Reports (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports'
          retention-days: 2

      - name: Generate Surefire HTML Report
        run: mvn surefire-report:report-only

      - name: Copy Surefire Reports Folder to Pages Directory
        run: |
          mkdir -p report-html
          cp -r core/target/reports/* report-html/
          cp report-html/surefire.html report-html/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./report-html

  deploy:
    name: Deploy HTML Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
